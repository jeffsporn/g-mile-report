name: Test Constant Contact Connection

on:
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CC contact lists
        env:
          CC_ACCESS_TOKEN: ${{ secrets.CC_ACCESS_TOKEN }}
        run: |
          node - <<'EOF'
          const https = require('https');

          const raw = (process.env.CC_ACCESS_TOKEN || '');
          const match = raw.match(/eyJ[A-Za-z0-9\-_.]+/);
          const token = match ? match[0] : '';

          if (!token) {
            console.error('No JWT found in secret.');
            process.exit(1);
          }

          function get(path) {
            return new Promise((resolve, reject) => {
              const req = https.request({
                hostname: 'api.cc.email',
                path: '/v3' + path,
                method: 'GET',
                headers: {
                  'Authorization': 'Bearer ' + token,
                  'Content-Type': 'application/json',
                },
              }, res => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve({ status: res.statusCode, body: JSON.parse(data) }));
              });
              req.on('error', reject);
              req.end();
            });
          }

          async function main() {
            console.log('Testing Constant Contact API connection...');

            const r = await get('/contact_lists?limit=25&include_count=true');
            if (r.status !== 200) {
              console.error('Failed (' + r.status + '):', JSON.stringify(r.body));
              process.exit(1);
            }

            const lists = r.body.lists || [];
            console.log('\nConnection successful!');
            console.log('Contact lists found: ' + lists.length);
            if (lists.length === 0) {
              console.log('(No lists yet - that is fine)');
            } else {
              lists.forEach(l => console.log('  [' + l.list_id + '] ' + l.name + ' - ' + (l.membership_count || 0) + ' contacts'));
            }
          }

          main().catch(err => { console.error(err.message); process.exit(1); });
          EOF
