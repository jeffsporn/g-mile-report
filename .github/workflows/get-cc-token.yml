name: Get Constant Contact Token

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Paste the code= value from the Constant Contact redirect URL'
        required: true

jobs:
  exchange-token:
    runs-on: ubuntu-latest
    steps:
      - name: Exchange auth code for tokens
        env:
          CC_API_KEY: ${{ secrets.CC_API_KEY }}
          CC_CLIENT_SECRET: ${{ secrets.CC_CLIENT_SECRET }}
        run: |
          node - <<'EOF'
          const https = require('https');
          const fs = require('fs');

          const CLIENT_ID = process.env.CC_API_KEY;
          const CLIENT_SECRET = process.env.CC_CLIENT_SECRET;
          const REDIRECT_URI = 'https://localhost';
          const code = '${{ github.event.inputs.code }}';

          const credentials = Buffer.from(`${CLIENT_ID}:${CLIENT_SECRET}`).toString('base64');
          const body = `grant_type=authorization_code&code=${encodeURIComponent(code)}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;

          const req = https.request({
            hostname: 'authz.constantcontact.com',
            path: '/oauth2/default/v1/token',
            method: 'POST',
            headers: {
              'Authorization': `Basic ${credentials}`,
              'Content-Type': 'application/x-www-form-urlencoded',
              'Content-Length': Buffer.byteLength(body),
            },
          }, res => {
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', () => {
              const json = JSON.parse(data);
              if (json.error) {
                console.error('Error:', json.error_description || json.error);
                process.exit(1);
              }
              const content = [
                `CC_ACCESS_TOKEN=${json.access_token}`,
                `CC_REFRESH_TOKEN=${json.refresh_token || 'none'}`,
                `Expires in: ${json.expires_in} seconds (${Math.round(json.expires_in/3600)} hours)`,
              ].join('\n');
              fs.writeFileSync('cc-tokens.txt', content);
              console.log('Token written to cc-tokens.txt artifact.');
            });
          });

          req.on('error', err => { console.error(err.message); process.exit(1); });
          req.write(body);
          req.end();
          EOF

      - name: Upload token file
        uses: actions/upload-artifact@v4
        with:
          name: cc-tokens
          path: cc-tokens.txt
          retention-days: 1
