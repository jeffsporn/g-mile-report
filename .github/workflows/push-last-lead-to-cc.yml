name: Push Lead to Constant Contact

on:
  workflow_dispatch:
    inputs:
      first_name:
        description: 'First name'
        required: true
      last_name:
        description: 'Last name'
        required: true
      email:
        description: 'Email address'
        required: true
      company:
        description: 'Company name'
        required: false
      phone:
        description: 'Phone number'
        required: false
      list_id:
        description: 'CC List ID (leave blank to use default)'
        required: false
        default: '0a966a34-091a-11f1-8057-0242df035ccf'

jobs:
  push-lead:
    runs-on: ubuntu-latest
    steps:
      - name: Push lead to Constant Contact
        run: |
          node - <<'EOF'
          const https = require('https');

          const raw = (process.env.CC_ACCESS_TOKEN || '');
          const match = raw.match(/eyJ[A-Za-z0-9\-_.]+/);
          const token = match ? match[0] : '';

          if (!token) {
            console.error('ERROR: CC_ACCESS_TOKEN secret is missing or invalid.');
            process.exit(1);
          }

          const firstName = '${{ github.event.inputs.first_name }}';
          const lastName  = '${{ github.event.inputs.last_name }}';
          const email     = '${{ github.event.inputs.email }}';
          const company   = '${{ github.event.inputs.company }}';
          const phone     = '${{ github.event.inputs.phone }}';
          const listId    = '${{ github.event.inputs.list_id }}';

          console.log(`\nPushing lead to Constant Contact:`);
          console.log(`  Name:    ${firstName} ${lastName}`);
          console.log(`  Email:   ${email}`);
          console.log(`  Company: ${company || '(none)'}`);
          console.log(`  Phone:   ${phone || '(none)'}`);
          console.log(`  List:    ${listId}\n`);

          const contact = {
            email_address: email,
            first_name: firstName,
            last_name: lastName,
          };

          if (company) contact.company_name = company;
          if (phone) {
            contact.phone_numbers = [{ phone_number: phone, kind: 'work' }];
          }
          if (listId) contact.list_memberships = [listId];

          const body = JSON.stringify(contact);

          const req = https.request({
            hostname: 'api.cc.email',
            path: '/v3/contacts/sign_up_form',
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(body),
            },
          }, res => {
            let data = '';
            res.on('data', chunk => data += chunk);
            res.on('end', () => {
              console.log(`Response status: ${res.statusCode}`);
              if (res.statusCode === 200 || res.statusCode === 201) {
                const json = JSON.parse(data);
                console.log(`\nSuccess! Contact created/updated in Constant Contact.`);
                console.log(`Contact ID: ${json.contact_id}`);
                console.log(`Action:     ${json.action}`);
              } else {
                console.error(`\nError response from CC API:`);
                console.error(data);
                process.exit(1);
              }
            });
          });

          req.on('error', err => { console.error(err.message); process.exit(1); });
          req.write(body);
          req.end();
          EOF
        env:
          CC_ACCESS_TOKEN: ${{ secrets.CC_ACCESS_TOKEN }}
